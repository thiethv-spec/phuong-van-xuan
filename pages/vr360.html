<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR360 – Di tích Phường Vạn Xuân</title>
  <meta name="description" content="Tham quan thực tế ảo 360° các di tích lịch sử phường Vạn Xuân, tỉnh Thái Nguyên.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font chung toàn site – khai báo font ở theme.css (--vx-font-heading / --vx-font-body) -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/pages/vr360.css">
</head>
<!-- Route "vr360":  vr360.html?id=<id>  -> player VR360 (iframe vr360-dia-diem.html) của di tích + danh sách "Tiếp theo"
     Dữ liệu tour: tools/build_vr360.py -> root_data/vr360/vr360-sites.js -->
<body data-route="vr360">
  <div data-vx-header></div>

  <main class="vxv">
    <div class="container container-vx">
      <div class="vxv-grid">
        <!-- Cột chính: player + thông tin -->
        <section class="vxv-main" aria-labelledby="vrTitle">
          <div class="vxv-player" id="vrPlayer"></div>

          <h1 class="vxv-title" id="vrTitle"></h1>
          <div class="vxv-meta-row">
            <div class="vxv-channel">
              <img class="vxv-channel__logo" src="../assets/img/logo-thai-nguyen.webp" alt="" width="40" height="42">
              <div>
                <strong>Di tích lịch sử Vạn Xuân</strong>
                <small id="vrRank"></small>
              </div>
            </div>
            <div class="vxv-actions" id="vrActions"></div>
          </div>

          <div class="vxv-desc" id="vrDesc">
            <div class="vxv-desc__meta" id="vrMeta"></div>
            <div class="vxv-desc__body" id="vrBody"></div>
          </div>
        </section>

        <!-- Cột phải: danh sách tiếp theo -->
        <aside class="vxv-side" aria-label="Di tích khác">
          <h2 class="vxv-side__title">Tiếp theo</h2>
          <div class="vxv-list" id="vrList"></div>
        </aside>
      </div>
    </div>
  </main>

  <div data-vx-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../root_data/vx-data.js"></script>
  <script src="../root_data/vr360/vr360-sites.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/vr360.js"></script>
</body>
</html>
