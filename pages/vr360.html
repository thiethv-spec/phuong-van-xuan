<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR360 – Di tích Phường Vạn Xuân</title>
  <meta name="description" content="Tham quan thực tế ảo 360° các di tích lịch sử phường Vạn Xuân, tỉnh Thái Nguyên.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<!-- Route "vr360":  vr360.html          -> chọn di tích
                     vr360.html?id=<id>  -> mở tour 360 của di tích (đọc site.vr360 trong root_data) -->
<body data-route="vr360">
  <div data-vx-header></div>

  <main class="vx-section vx-section--red-dark">
    <div class="container container-vx">
      <div class="vx-head vx-head--dark">
        <h1 class="vx-title" id="vrTitle">Tham quan VR360</h1>
        <p class="vx-lead" id="vrLead">Chọn một di tích để bắt đầu.</p>
      </div>
      <!-- Khung viewer 360 – thư viện viewer (Pannellum / Marzipano / krpano...) sẽ gắn ở bước sau -->
      <div id="vrViewer" class="vx-map-frame d-flex align-items-center justify-content-center text-center p-4" style="min-height:420px;background:#111;color:#eee"></div>
      <div id="vrList" class="d-flex flex-wrap gap-2 justify-content-center mt-4"></div>
    </div>
  </main>

  <div data-vx-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../root_data/vx-data.js"></script>
  <script src="../assets/js/router.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/pages/vr360.js"></script>
</body>
</html>
